[project]
name = "suits4men-lightspeed-mcp"
version = "1.1.1"
requires-python = ">=3.13"
dependencies = [
    "filelock>=4.2.4",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp>=2.3.0",
    "truststore>=0.10.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
